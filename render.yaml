services:
  - type: web
    name: colorless
    runtime: python
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix frontend run build:check && python tests/deploy_preflight.py --environment --remote && python -m pip install . && python -m compileall -q src/colorless
    startCommand: python -m colorless
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 45
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 22.22.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PHONE_VERIFICATION_MODE
        value: prod
      # No production SMS adapter is configured yet; OAuth and existing local logins remain available.
      - key: LOCAL_SIGNUP_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: MAX_REQUEST_THREADS
        value: "64"
      - key: MAX_BODY_READERS
        value: "16"
      - key: HEADER_READ_TIMEOUT_SECONDS
        value: "5"
      - key: BODY_READ_TIMEOUT_SECONDS
        value: "10"
      - key: UPLOAD_READ_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_SSE_CONNECTIONS
        value: "32"
      - key: MAX_SSE_QUEUE_SIZE
        value: "32"
      - key: SSE_HEARTBEAT_SECONDS
        value: "10"
      - key: EVENT_POLL_INTERVAL_SECONDS
        value: "0.1"
      - key: PRESENCE_TTL_SECONDS
        value: "45"
      - key: SHORTS_COLLECTION_INTERVAL_SECONDS
        value: "1800"
      - key: SHORTS_DAILY_QUOTA_BUDGET
        value: "5000"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SOCIAL_DEMO_LOGIN_ENABLED
        value: "false"
      - key: REQUIRE_SUPABASE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
