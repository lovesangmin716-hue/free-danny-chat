<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>회원가입 · Colorless</title>
    <link rel="stylesheet" href="/assets/css/signup.css" />
    <script defer src="/assets/js/signup.js?v=1b60516f4029"></script>
  </head>
  <body>
    <main class="signup-shell">
      <aside class="signup-intro">
        <a class="back-link" href="/">← 로그인</a>
        <div>
          <p class="eyebrow">Colorless</p>
          <h1>새 계정 만들기</h1>
          <p>채팅에 필요한 정보만 입력하고 시작하세요.</p>
        </div>
        <p class="desktop-note">친구 ID는 다른 사용자가 나를 찾을 때 사용합니다.</p>
      </aside>

      <section class="signup-panel" aria-labelledby="signup-title">
        <header class="mobile-heading">
          <a class="back-link" href="/">← 로그인</a>
          <p class="eyebrow">Colorless</p>
          <h1 id="signup-title">회원가입</h1>
        </header>

        <p class="signup-status" id="signup-status" aria-live="polite">휴대폰 인증 후 계정을 만들 수 있어요.</p>

        <form id="signup-form">
          <div class="form-grid">
            <div class="field">
              <label for="signup-username">사용자 이름</label>
              <input id="signup-username" maxlength="24" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="signup-friend-code">친구 ID</label>
              <input id="signup-friend-code" maxlength="20" autocomplete="off" autocapitalize="off" placeholder="colorless_01" required />
            </div>
            <div class="field">
              <label for="signup-password">비밀번호</label>
              <input id="signup-password" type="password" minlength="4" maxlength="40" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="signup-password-confirm">비밀번호 확인</label>
              <input id="signup-password-confirm" type="password" minlength="4" maxlength="40" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="signup-age-group">연령대</label>
              <select id="signup-age-group" required>
                <option value="" selected disabled>연령대 선택</option>
                <option value="10대">10대</option>
                <option value="20대">20대</option>
                <option value="30대">30대</option>
                <option value="40대">40대</option>
                <option value="50대 이상">50대 이상</option>
              </select>
            </div>
            <div class="field">
              <label for="signup-gender">성별</label>
              <select id="signup-gender" required>
                <option value="" selected disabled>성별 선택</option>
                <option value="여성">여성</option>
                <option value="남성">남성</option>
              </select>
            </div>
            <div class="field field-wide">
              <label for="signup-phone">휴대폰 번호</label>
              <div class="inline-field">
                <input id="signup-phone" maxlength="13" inputmode="numeric" autocomplete="tel" required />
                <button type="button" class="secondary-button" id="phone-request-button">인증번호 받기</button>
              </div>
            </div>
            <div class="field field-wide">
              <label for="signup-code">인증번호</label>
              <div class="inline-field">
                <input id="signup-code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required />
                <button type="button" class="secondary-button" id="phone-verify-button">인증 확인</button>
              </div>
            </div>
          </div>

          <p class="phone-help" id="phone-help">개발 환경에서는 인증번호가 화면에 표시됩니다.</p>
          <div class="verified-badge hidden" id="phone-verified-badge">휴대폰 인증 완료</div>
          <button type="submit" id="signup-submit-button" disabled>가입하고 시작하기</button>
        </form>
      </section>
    </main>
  </body>
</html>
