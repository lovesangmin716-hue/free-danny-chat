name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: frontend
      - run: npm run build:check
        working-directory: frontend
      - run: python tests/js_syntax.py
      - run: node tests/http_cache.mjs
      - run: node tests/realtime_events.mjs
      - run: node tests/chat_outbox.mjs
      - run: node tests/message_revisions.mjs
      - run: node tests/room_snapshots.mjs
      - run: node tests/action_pipeline.mjs
      - run: node tests/submit_guard.mjs
      - run: python tests/static_budget.py
      - run: python tests/deploy_preflight.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/profile_art_benchmark.py
      - run: python tests/bootstrap_scale.py --count 1000 --iterations 20
      - run: python tests/multi_instance.py
      - run: python tests/operations_load.py --profile smoke
